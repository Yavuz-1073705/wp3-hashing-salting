{% extends 'base.html' %}

{% block title %}Inloggen{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <img src="{{ url_for('static', filename='logo-test-correct.webp') }}" alt="Test-Correct" height="40">
        </div>

        <h1 class="login-title">Welkom terug</h1>
        <p class="login-subtitle">Log in om je dashboard te bekijken</p>

        {% if error %}
        <p class="login-error" role="alert">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('auth.login') }}" method="post" id="login-form" novalidate>
            <div class="form-group">
                <label for="id_email">E-mailadres</label>
                <input
                    type="email"
                    name="email"
                    id="id_email"
                    autocomplete="email"
                    autofocus
                    required
                    placeholder="naam@school.nl"
                >
            </div>

            <div class="form-group">
                <label for="id_password">Wachtwoord</label>
                <input
                    type="password"
                    name="password"
                    id="id_password"
                    autocomplete="current-password"
                    required
                    placeholder="••••••••"
                >
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary login-btn">Inloggen</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
