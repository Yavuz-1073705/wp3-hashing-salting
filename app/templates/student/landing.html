{% extends 'base.html' %}

{% block title %}Leerling Selectie{% endblock %}

{% block content %}
<h2>Leerling Dashboard</h2>
<p>Kies je account om je resultaten te bekijken.</p>

<ul class="student-list">
    {% for student in students %}
    <li>
        <a href="{{ url_for('student.dashboard', student_id=student.id) }}">{{ student.name }}</a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
